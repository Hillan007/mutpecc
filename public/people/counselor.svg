<svg width="320" height="320" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Guidance counselor owl">
  <defs>
    <radialGradient id="bgC" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#0b2a2a" />
      <stop offset="100%" stop-color="#052025" />
    </radialGradient>
    <linearGradient id="owlFur" x1="0" x2="1">
      <stop offset="0%" stop-color="#f5f0e6" />
      <stop offset="100%" stop-color="#c9bba7" />
    </linearGradient>
  </defs>

  <rect width="320" height="320" rx="160" fill="url(#bgC)" />

  <!-- owl body -->
  <g>
    <ellipse cx="160" cy="150" rx="78" ry="86" fill="url(#owlFur)" />
    <ellipse cx="160" cy="172" rx="54" ry="44" fill="#fff9ee" />
  </g>

  <!-- eyes with glasses -->
  <g stroke="#2b2b2b" stroke-width="3" fill="none">
    <circle cx="136" cy="148" r="14" fill="#0b0b0b" />
    <circle cx="184" cy="148" r="14" fill="#0b0b0b" />
    <path d="M150 148 H170" stroke="#2b2b2b" stroke-width="4" />
  </g>
  <g>
    <circle cx="132" cy="144" r="4" fill="#fff" />
    <circle cx="180" cy="144" r="4" fill="#fff" />
  </g>

  <!-- beak -->
  <path d="M160 170 L172 162 L160 154 Z" fill="#c5801b" />

  <!-- book hint at base -->
  <rect x="96" y="214" width="128" height="22" rx="4" fill="#f3e8d6" />
  <rect x="96" y="238" width="128" height="8" rx="2" fill="#e6d3b8" />

  <text x="160" y="286" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#fff">Ms Goretti W. Runnoh</text>
</svg>
