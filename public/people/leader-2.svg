<svg width="320" height="320" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tiger portrait">
  <defs>
    <radialGradient id="bg2" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#0b1220" />
      <stop offset="100%" stop-color="#08121a" />
    </radialGradient>
    <linearGradient id="fur2" x1="0" x2="1">
      <stop offset="0%" stop-color="#ffb347" />
      <stop offset="70%" stop-color="#ff6f3c" />
      <stop offset="100%" stop-color="#8b2e00" />
    </linearGradient>
  </defs>

  <rect width="320" height="320" rx="160" fill="url(#bg2)" />
  <g>
    <circle cx="160" cy="140" r="96" fill="url(#fur2)" />
    <!-- stripes -->
    <path d="M100 110 C130 80, 190 80, 220 110" stroke="#6b2a12" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
    <path d="M90 150 C120 130, 200 130, 230 150" stroke="#6b2a12" stroke-width="10" stroke-linecap="round" opacity="0.85" />
    <path d="M110 180 C140 170, 180 170, 210 180" stroke="#6b2a12" stroke-width="6" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- face -->
  <ellipse cx="160" cy="155" rx="54" ry="60" fill="#fbe0b0" />
  <ellipse cx="160" cy="170" rx="42" ry="44" fill="#fff2df" />

  <!-- eyes -->
  <g>
    <ellipse cx="138" cy="150" rx="9" ry="12" fill="#0f0f0f" />
    <ellipse cx="182" cy="150" rx="9" ry="12" fill="#0f0f0f" />
    <circle cx="136" cy="146" r="3" fill="#fff" />
    <circle cx="180" cy="146" r="3" fill="#fff" />
  </g>

  <!-- nose/muzzle -->
  <path d="M150 178 C158 186, 162 186, 170 178" stroke="#5b321a" stroke-width="4" stroke-linecap="round" fill="none" />
  <path d="M150 172 C148 176, 160 184, 170 172" fill="#5b321a" opacity="0.05" />

  <text x="160" y="282" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#fff" opacity="0.95">Tiger</text>
</svg>
