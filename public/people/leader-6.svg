<svg width="320" height="320" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Fox portrait">
  <defs>
    <radialGradient id="bg6" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#120709" />
      <stop offset="100%" stop-color="#050405" />
    </radialGradient>
    <linearGradient id="fur6" x1="0" x2="1">
      <stop offset="0%" stop-color="#ffb074" />
      <stop offset="60%" stop-color="#ff7a3c" />
      <stop offset="100%" stop-color="#8b3a10" />
    </linearGradient>
    <linearGradient id="face6" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#fff3e6" />
      <stop offset="100%" stop-color="#ffdcbf" />
    </linearGradient>
  </defs>

  <rect width="320" height="320" rx="160" fill="url(#bg6)" />

  <!-- main vignette -->
  <g>
    <circle cx="160" cy="140" r="96" fill="url(#fur6)" />
  </g>

  <!-- face -->
  <ellipse cx="160" cy="158" rx="52" ry="60" fill="url(#face6)" />
  <path d="M120 140 C130 110, 190 110, 200 140 C190 180, 130 180, 120 140 Z" fill="#ff8f4a" opacity="0.18" />

  <!-- ears -->
  <path d="M116 112 L132 86 C138 76, 150 74, 154 86 L138 110 Z" fill="#8b3a10" opacity="0.9" />
  <path d="M204 112 L188 86 C182 76, 170 74, 166 86 L182 110 Z" fill="#8b3a10" opacity="0.9" />

  <!-- eyes -->
  <g>
    <ellipse cx="138" cy="150" rx="8" ry="10" fill="#0b0b0b" />
    <ellipse cx="182" cy="150" rx="8" ry="10" fill="#0b0b0b" />
    <circle cx="136" cy="146" r="2.5" fill="#fff" />
    <circle cx="180" cy="146" r="2.5" fill="#fff" />
  </g>

  <!-- nose and snout -->
  <path d="M152 178 C156 182, 164 182, 168 178" stroke="#3b2312" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M160 174 C150 178, 150 186, 160 188 C170 186, 170 178, 160 174 Z" fill="#3b2312" />

  <!-- subtle whiskers -->
  <path d="M122 174 C136 170, 146 172, 154 174" stroke="#6b3a1a" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />
  <path d="M198 174 C184 170, 174 172, 166 174" stroke="#6b3a1a" stroke-width="1.2" stroke-linecap="round" opacity="0.6" />

  <text x="160" y="282" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#fff" opacity="0.95">Fox</text>
</svg>
