<svg width="320" height="320" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Eagle portrait">
  <defs>
    <radialGradient id="bg5" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#081018" />
      <stop offset="100%" stop-color="#05070a" />
    </radialGradient>
    <linearGradient id="feather" x1="0" x2="1">
      <stop offset="0%" stop-color="#f6f1e6" />
      <stop offset="100%" stop-color="#c9bba7" />
    </linearGradient>
  </defs>

  <rect width="320" height="320" rx="160" fill="url(#bg5)" />

  <g>
    <circle cx="160" cy="140" r="92" fill="#3e3b35" />
    <ellipse cx="160" cy="170" rx="52" ry="44" fill="url(#feather)" />
    <!-- beak -->
    <path d="M160 176 L176 166 L160 156 Z" fill="#e3a21a" />
  </g>

  <!-- eyes -->
  <g>
    <circle cx="138" cy="148" r="9" fill="#0b0b0b" />
    <circle cx="182" cy="148" r="9" fill="#0b0b0b" />
    <circle cx="136" cy="145" r="2.5" fill="#fff" />
    <circle cx="180" cy="145" r="2.5" fill="#fff" />
  </g>

  <text x="160" y="282" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#fff" opacity="0.95">Eagle</text>
</svg>
